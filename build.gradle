plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.0.6'
	id "com.diffplug.spotless" version "6.25.0"
	id "com.google.osdetector" version "1.7.3"
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

spotless {
	java {
		// Use Google Java Format (AOSP style for 4-space indentation)
		googleJavaFormat().aosp()
		// Remove unused imports
		removeUnusedImports()
		// Format Javadoc
		formatAnnotations()
	}
}

checkstyle {
	toolVersion = "10.13.0"
	configFile = file("config/checkstyle/checkstyle.xml")
}

spotbugs {
	toolVersion = '4.8.3'
	excludeFilter = file("config/spotbugs/excludeFilter.xml")
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.2"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
	
	// Structured Logging
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
	// Distributed Tracing
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    
    // AOP
    implementation 'org.springframework.boot:spring-boot-starter-aop'

	developmentOnly 'org.springframework.boot:spring-boot-devtools:3.2.4'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	
	if (osdetector.os == "osx") {
		runtimeOnly "io.netty:netty-resolver-dns-native-macos::${osdetector.classifier}"
	}
	
	// Try individual dependencies if starter-test fails to pull them
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework:spring-test'

	// ArchUnit
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'

	// WireMock
	testImplementation 'org.wiremock.integrations:wiremock-spring-boot:3.0.1'
	
	testImplementation 'org.assertj:assertj-core:3.26.3' // Ensure assertj is present
	
	// SpotBugs Annotations
	compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.3'
	testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.3'
}

tasks.named('test') {
	useJUnitPlatform()
	filter {
		excludeTestsMatching "*IntegrationTest"
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching("*IntegrationTest")
	}
	shouldRunAfter(tasks.named('test'))
}

check.dependsOn integrationTest

jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test, integrationTest
	executionData fileTree(project.buildDir).include("jacoco/*.exec")
	
	reports {
		xml.required = true
		html.required = true
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				"com/example/demo/dto/**",
				"com/example/demo/domain/**",
				"com/example/demo/mapper/**",
				"com/example/demo/config/**",
				"com/example/demo/DemoApplication.class",
				"com/example/demo/exception/**",
				"com/example/demo/aspect/**"
			])
		}))
	}
}

tasks.register('jacocoFullReport', JacocoReport) {
    description = "Generates a combined JaCoCo report for unit and integration tests."
    group = "verification"
    
    dependsOn test, integrationTest
    
    executionData fileTree(project.buildDir).include("jacoco/*.exec")
    
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: [
            "com/example/demo/dto/**",
            "com/example/demo/domain/**",
            "com/example/demo/mapper/**",
            "com/example/demo/config/**",
            "com/example/demo/DemoApplication.class",
            "com/example/demo/exception/**",
            "com/example/demo/aspect/**"
        ])
    }))
    
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				minimum = 0.50 // Initial threshold, can be increased later
			}
		}
	}
}

jar {
	enabled = false
}

bootJar {
	archiveFileName = 'demo-app.jar'
}

tasks.register('bootRunPostgresLocal') {
	group = 'application'
	description = 'Ensures the local demodb exists in Postgres and starts the application.'
	
	doFirst {
		logger.lifecycle("Checking if local database 'demodb' exists in Postgres...")
		def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
		exec {
			if (isWindows) {
				commandLine 'cmd', '/c', 'psql -lqt | findstr /W demodb || createdb demodb'
			} else {
				commandLine 'sh', '-c', 'psql -lqt | cut -d \\| -f 1 | grep -qw demodb || createdb demodb'
			}
		}
	}
	
	finalizedBy 'bootRunPostgresLocalExecution'
}

tasks.register('bootRunPostgresLocalExecution', JavaExec) {
	group = 'application'
	mainClass = 'com.example.demo.DemoApplication'
	classpath = sourceSets.main.runtimeClasspath
	args = ["--spring.profiles.active=local-pg"]
	jvmArgs = ["-Dspring.output.ansi.enabled=ALWAYS"]
}
