name: CI

on:
  push:
    branches: [ main, go ]
  pull_request:
    branches: [ main, go ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Run go fmt
        run: |
          if output=$(gofmt -l .); then
            if [ -n "$output" ]; then
              echo "Files not formatted:" && echo "$output"
              exit 1
            fi
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.60.3
          args: --timeout 5m
          skip-cache: true
